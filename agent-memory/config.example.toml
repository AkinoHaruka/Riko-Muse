# memoryd 非秘密配置示例。令牌与模型密钥严禁写入本文件（doc/09）。
# 令牌由 `memoryd principal add` 生成到独立秘密文件；模型密钥从单独秘密文件读取。

listen_addr = "127.0.0.1:8791"
db_path = "data/agent-memory.db"
migrations_dir = "migrations"

# ---- 以下键为首版已定义的非秘密默认项，serve 暂不强制要求 ----
