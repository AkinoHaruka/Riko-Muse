[package]
name = "memory-server"
description = "memoryd：HTTP、认证、生命周期与观测（doc/09、doc/12）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "memoryd"
path = "src/main.rs"

[dependencies]
memory-contract.workspace = true
memory-domain.workspace = true
memory-store-sqlite.workspace = true
memory-extract.workspace = true
memory-recall.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v7"] }
# v2 模型客户端（doc2/05 §2）：HTTPS/TLS、DNS、超时、有界响应、标准编码。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
futures-util = "0.3"
