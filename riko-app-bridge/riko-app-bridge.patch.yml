- insert:
    - id: riko-app-api
      name: '@riko/riko-app-api'
      disabled: !!js "!(process.env.RIKO_APP_API_TOKEN_FILE && process.env.RIKO_APP_SESSION_REGISTRY_FILE)"
      config:
        apiTokenFile: !!js process.env.RIKO_APP_API_TOKEN_FILE
        sessionRegistryFile: !!js process.env.RIKO_APP_SESSION_REGISTRY_FILE
