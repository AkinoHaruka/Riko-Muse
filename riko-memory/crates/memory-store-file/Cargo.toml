[package]
name = "memory-store-file"
description = "Direct file_store_v1 persistence for core memory objects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memory-domain.workspace = true
memory-file-format.workspace = true
thiserror.workspace = true
serde.workspace = true
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v7"] }
rand = "0.8"
base64 = "0.22"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
